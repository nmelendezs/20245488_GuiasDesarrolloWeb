<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="../js/pedidos.js" defer></script>
</head>
<body class="bg-light">
    <main class="container py-4">
        <h1 class="h3 mb-1">Gestión de pedidos</h1>
        <p class="text-secondary">Registra los pedidos de la cafetería. Los datos se conservan solo mientras esta página permanece abierta.</p>

        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h5">Nuevo pedido</h2>
                <form id="formPedido" class="row g-3" novalidate>
                    <div class="col-12 col-md-5">
                        <label class="form-label" for="producto">Producto</label>
                        <input class="form-control" id="producto" name="producto" type="text" required />
                    </div>
                    <div class="col-6 col-md-3">
                        <label class="form-label" for="precio">Precio unitario</label>
                        <input class="form-control" id="precio" name="precio" type="number" min="0.01" step="0.01" required />
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label" for="cantidad">Cantidad</label>
                        <input class="form-control" id="cantidad" name="cantidad" type="number" min="1" step="1" required />
                    </div>
                    <div class="col-12 col-md-2 d-flex align-items-end">
                        <button class="btn btn-primary w-100" id="btnAgregar" type="button">Agregar pedido</button>
                    </div>
                </form>
                <p id="mensaje" class="text-danger mt-3 mb-0" hidden></p>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-body">
                <div class="row g-3 align-items-end mb-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label" for="precioMaximo">Precio máximo</label>
                        <input class="form-control" id="precioMaximo" type="number" min="0" step="0.01" />
                    </div>
                    <div class="col-12 col-md-8 d-flex flex-wrap gap-2">
                        <button class="btn btn-outline-primary" id="btnFiltrar" type="button">Filtrar productos</button>
                        <button class="btn btn-outline-secondary" id="btnMostrar" type="button">Mostrar todos</button>
                        <button class="btn btn-outline-danger" id="btnLimpiar" type="button">Limpiar pedidos</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped align-middle mb-3">
                        <thead class="table-success">
                            <tr>
                                <th scope="col">Producto</th>
                                <th scope="col">Precio unitario</th>
                                <th scope="col">Cantidad</th>
                                <th scope="col">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla"></tbody>
                    </table>
                </div>

                <p class="mb-1">Total de unidades: <strong id="totalUnidades">0</strong></p>
                <p class="mb-0">Monto total: <strong id="montoTotal">0.00</strong></p>
            </div>
        </section>

        <p class="mt-3 mb-0"><a href="../index.html">Regresar</a></p>
    </main>
</body>
</html>
